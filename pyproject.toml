[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-wake-aware-verification"
version = "0.1.0"
description = "Wake-aware performance verification and fault detection for wind turbines from SCADA data (WARP method, validated with injected faults on open Kelmarsh data)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "py_wake>=2.6",
    "wind-power-curve-kelmarsh @ git+https://github.com/kwwaleszczynski-del/wind-power-curve-kelmarsh@9046a8ff4e6b8d27dabba36ceaa901cd972935ea",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wake-aware = "wake_aware.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning"]
